# ===========================
# Search Engine Simulator
# Spring Boot Configuration
# ===========================

spring.application.name=search-engine-simulator

# ===========================
# H2 Database Configuration
# ===========================
spring.datasource.url=jdbc:h2:mem:searchenginedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 Console for development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===========================
# Server Configuration
# ===========================
server.port=8080

# ===========================
# Logging
# ===========================
logging.level.com.searchengine.simulator=INFO
logging.level.org.springframework.web=INFO

# ===========================
# Security & JWT Configuration
# ===========================
# 86400000 ms = 24 hours
jwt.secret=${JWT_SECRET:default_local_jwt_secret_key_which_must_be_at_least_256_bits_long_default_local_jwt_secret_key_which_must_be_at_least_256_bits_long}
jwt.expiration-ms=86400000

# ===========================
# Google OAuth2 Configuration
# ===========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:optional-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:optional-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email
